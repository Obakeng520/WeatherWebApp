<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            /* Modern Glassmorphism Palette */
            --bg-dark: #020617; 
            --bg-light: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.6);         
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover: rgba(51, 65, 85, 0.8);      
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-yellow: #fbbf24;   
            --accent-blue: #38bdf8;     
            --accent-blue-hover: #7dd3fc;
            --accent-purple: #818cf8;   
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            /* Premium dark gradient background */
            background: radial-gradient(circle at top right, var(--bg-light), var(--bg-dark));
            background-attachment: fixed;
            color: var(--text-primary);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Header & Search --- */
        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            gap: 20px;
            animation: fadeInDown 0.8s ease-out;
        }

        .search-container {
            display: flex;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 50px; /* Pill shape */
            padding: 5px 5px 5px 20px;
            align-items: center;
            flex-grow: 1;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .search-container:focus-within { 
            box-shadow: 0 0 0 2px var(--accent-blue), 0 4px 15px rgba(0,0,0,0.4); 
            background: rgba(30, 41, 59, 0.8);
        }

        .search-container input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 10px 10px;
            width: 100%;
            font-size: 1.05rem;
            outline: none;
        }

        .search-container input::placeholder {
            color: var(--text-secondary);
        }

        /* The New Search Button */
        .search-btn {
            background: var(--accent-blue);
            color: #0f172a;
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s ease;
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }

        .search-btn:hover {
            background: var(--accent-blue-hover);
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.5);
        }

        /* --- Main Layout --- */
        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            width: 100%;
            max-width: 1200px;
            animation: fadeInUp 0.8s ease-out;
        }

        /* Top Section: Main Info + Chart */
        .top-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        /* Daily Forecast Row */
        .forecast-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
        }

        /* Grid for Detailed Cards */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
        }

        /* --- Card Components (Glassmorphism) --- */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-large-value {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Chart Card */
        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
        }

        /* Forecast Card */
        .forecast-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        
        .forecast-card:hover { 
            background: var(--card-hover); 
            transform: translateY(-5px); 
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .forecast-day { font-weight: 600; color: var(--text-primary); font-size: 1rem; }
        .forecast-icon { font-size: 2.2rem; margin: 5px 0; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3)); }
        .forecast-temp { font-weight: bold; font-size: 1.1rem; }
        .forecast-low { color: var(--text-secondary); font-size: 0.85rem; }

        /* Specific Visuals */
        .compass-circle {
            width: 90px;
            height: 90px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.2);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .compass-arrow {
            font-size: 2.2rem;
            color: var(--accent-blue);
            transform-origin: center;
            transition: transform 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .compass-label { position: absolute; font-size: 0.75rem; color: var(--text-secondary); font-weight: 700; }
        .c-n { top: 6px; } .c-e { right: 8px; } .c-s { bottom: 6px; } .c-w { left: 8px; }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            width: 0%;
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 10px;
        }

        .sun-arc {
            width: 100%;
            height: 70px;
            border-top: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50% 50% 0 0;
            position: relative;
            margin-top: 25px;
        }
        .sun-dot {
            width: 18px;
            height: 18px;
            background: var(--accent-yellow);
            border-radius: 50%;
            position: absolute;
            top: -10px; 
            left: 50%; 
            box-shadow: 0 0 20px 5px rgba(251, 191, 36, 0.4);
            border: 2px solid #fff;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            width: 100%;
            max-width: 1200px;
            text-align: center;
            font-weight: 500;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Tweaks */
        @media (max-width: 768px) {
            header { flex-direction: column; align-items: stretch; text-align: center; }
            .search-container { max-width: 100%; }
            .card-large-value { font-size: 3.2rem; }
            .top-section { grid-template-columns: 1fr; }
            header > div:last-child { text-align: center !important; margin-top: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="search-container">
            <input type="text" id="cityInput" placeholder="Search for a city..." value="Sandton">
            <button class="search-btn" id="searchBtn">
                <i class="fas fa-search"></i>
            </button>
        </div>
        <div style="text-align: right;">
            <div id="displayCity" style="font-size: 1.4rem; font-weight: 700; letter-spacing: 0.5px;">--</div>
            <div id="currentDate" style="font-size: 0.95rem; color: var(--text-secondary); margin-top: 4px;">--</div>
        </div>
    </header>

    <div class="error-message" id="errorMessage"></div>

    <div class="container">

        <div class="top-section">
            <div class="card" style="justify-content: space-between;">
                <div class="card-header"><i class="fas fa-map-pin"></i> Current Weather</div>
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <div>
                        <div class="card-large-value" id="tempValue">--°</div>
                        <div style="font-size: 1.3rem; margin-top: 8px; color: var(--text-primary); font-weight: 500;" id="weatherDesc">--</div>
                    </div>
                    <div id="weatherIcon" style="font-size: 5rem; filter: drop-shadow(0 4px 15px rgba(251, 191, 36, 0.3));">
                        <i class="fas fa-sun"></i>
                    </div>
                </div>
                <div style="display: flex; gap: 30px; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
                    <div>
                        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 5px;">Feels Like</div>
                        <div style="font-size: 1.2rem; font-weight: 600;" id="feelsLikeValue">--°</div>
                    </div>
                    <div>
                        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 5px;">High / Low</div>
                        <div style="font-size: 1.2rem; font-weight: 600;" id="highLowValue">-- / --</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="fas fa-chart-line"></i> Hourly Forecast</div>
                <div class="chart-container">
                    <canvas id="hourlyChart"></canvas>
                </div>
            </div>
        </div>

        <div class="card" style="background: transparent; box-shadow: none; border: none; padding: 0; backdrop-filter: none;">
            <div class="card-header" style="padding-left: 5px;"><i class="fas fa-calendar-alt"></i> 5-Day Forecast</div>
            <div class="forecast-row" id="forecastContainer">
                <div class="forecast-card"><div class="skeleton" style="width:50px; height:50px;"></div></div>
                <div class="forecast-card"><div class="skeleton" style="width:50px; height:50px;"></div></div>
                <div class="forecast-card"><div class="skeleton" style="width:50px; height:50px;"></div></div>
                <div class="forecast-card"><div class="skeleton" style="width:50px; height:50px;"></div></div>
                <div class="forecast-card"><div class="skeleton" style="width:50px; height:50px;"></div></div>
            </div>
        </div>

        <div class="details-grid">
            
            <div class="card">
                <div class="card-header"><i class="fas fa-wind"></i> Wind Speed</div>
                <div style="text-align: center; margin-top: 10px;">
                    <div class="compass-circle">
                        <span class="compass-label c-n">N</span>
                        <span class="compass-label c-e">E</span>
                        <span class="compass-label c-s">S</span>
                        <span class="compass-label c-w">W</span>
                        <i class="fas fa-location-arrow compass-arrow" id="windArrow"></i>
                    </div>
                    <div style="font-size: 1.8rem; font-weight: 700; margin-top: 20px;">
                        <span id="windSpeed">--</span> <span style="font-size: 1.1rem; color: var(--text-secondary); font-weight: normal;">km/h</span>
                    </div>
                    <div style="font-size: 1rem; color: var(--accent-blue); margin-top: 5px; font-weight: 600;" id="windDirText">--</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="fas fa-tint"></i> Humidity</div>
                <div style="font-size: 3rem; font-weight: 700; margin-top: 10px;" id="humidityValue">--%</div>
                <div style="font-size: 0.95rem; color: var(--text-secondary); margin-top: 10px;">The dew point is <span id="dewPoint" style="color: var(--text-primary); font-weight: 600;">--°</span></div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="humidityBar"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="fas fa-eye"></i> Visibility</div>
                <div style="font-size: 2.5rem; font-weight: 700; margin-top: 5px;"><span id="visibilityValue">--</span> <span style="font-size: 1.2rem; color: var(--text-secondary); font-weight: normal;">km</span></div>
                <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <div class="card-header" style="margin-bottom: 8px;"><i class="fas fa-tachometer-alt"></i> Pressure</div>
                    <div style="font-size: 1.8rem; font-weight: 700;"><span id="pressureValue">--</span> <span style="font-size: 1.1rem; color: var(--text-secondary); font-weight: normal;">hPa</span></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="fas fa-sun"></i> Sunrise & Sunset</div>
                <div class="sun-arc">
                    <div class="sun-dot" style="left: 50%;"></div> </div>
                <div style="display: flex; justify-content: space-between; margin-top: 25px;">
                    <div>
                        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 5px;">Sunrise</div>
                        <div style="font-weight: 600; font-size: 1.1rem;" id="sunriseTime">--:--</div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 5px;">Sunset</div>
                        <div style="font-weight: 600; font-size: 1.1rem;" id="sunsetTime">--:--</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const apiKey = "c757762c64b04d5a34928acd4f7696b4"; 
        let weatherChart = null;

        // --- 1. Main Function ---
        async function getWeatherData(city) {
            const errorBox = document.getElementById("errorMessage");
            errorBox.style.display = "none";

            // If empty string, don't fetch
            if (!city.trim()) return;

            try {
                // Fetch Current Weather
                const weatherRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?units=metric&q=${city}&appid=${apiKey}`);
                if (!weatherRes.ok) throw new Error("Oops! We couldn't find that city. Please try again.");
                const currentData = await weatherRes.json();

                // Fetch Forecast (5 Day / 3 Hour)
                const forecastRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?units=metric&q=${city}&appid=${apiKey}`);
                const forecastData = await forecastRes.json();

                updateUI(currentData, forecastData);

            } catch (error) {
                console.error(error);
                errorBox.innerText = error.message;
                errorBox.style.display = "block";
            }
        }

        // --- 2. Update UI ---
        function updateUI(current, forecast) {
            // Header Info
            document.getElementById("displayCity").innerText = `${current.name}, ${current.sys.country}`;
            const now = new Date();
            document.getElementById("currentDate").innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

            // 1. Current Weather Card
            document.getElementById("tempValue").innerText = Math.round(current.main.temp) + "°";
            document.getElementById("weatherDesc").innerText = capitalize(current.weather[0].description);
            document.getElementById("feelsLikeValue").innerText = Math.round(current.main.feels_like) + "°";
            document.getElementById("highLowValue").innerText = `${Math.round(current.main.temp_max)}° / ${Math.round(current.main.temp_min)}°`;
            
            // Icon
            const iconCode = current.weather[0].icon;
            const iconContainer = document.getElementById("weatherIcon");
            iconContainer.innerHTML = getIconHTML(iconCode);
            iconContainer.style.color = getIconColor(iconCode);

            // 2. Wind
            const speedKmh = (current.wind.speed * 3.6).toFixed(1);
            document.getElementById("windSpeed").innerText = speedKmh;
            const rotation = current.wind.deg - 45; // Adjust for FontAwesome icon angle
            document.getElementById("windArrow").style.transform = `rotate(${rotation}deg)`;
            document.getElementById("windDirText").innerText = getCardinalDirection(current.wind.deg);

            // 3. Humidity
            document.getElementById("humidityValue").innerText = current.main.humidity + "%";
            // Timeout to allow the CSS transition to trigger visually after data loads
            setTimeout(() => {
                document.getElementById("humidityBar").style.width = current.main.humidity + "%";
            }, 100);
            
            const dewPoint = Math.round(current.main.temp - ((100 - current.main.humidity) / 5));
            document.getElementById("dewPoint").innerText = dewPoint + "°";

            // 4. Visibility & Pressure
            document.getElementById("visibilityValue").innerText = (current.visibility / 1000).toFixed(1);
            document.getElementById("pressureValue").innerText = current.main.pressure;

            // 5. Sun Times
            document.getElementById("sunriseTime").innerText = formatTime(current.sys.sunrise);
            document.getElementById("sunsetTime").innerText = formatTime(current.sys.sunset);

            // 6. Process Forecast Data
            updateForecast(forecast);
        }

        function updateForecast(data) {
            // A. Hourly Chart (First 8 data points = 24 hours)
            const hourlyData = data.list.slice(0, 8);
            const labels = hourlyData.map(item => {
                const date = new Date(item.dt * 1000);
                return date.getHours() + ":00";
            });
            const temps = hourlyData.map(item => item.main.temp);

            renderChart(labels, temps);

            // B. Daily Forecast (Filter for noon data roughly every 24h)
            const dailyData = data.list.filter(item => item.dt_txt.includes("12:00:00"));
            const forecastContainer = document.getElementById("forecastContainer");
            forecastContainer.innerHTML = ""; // Clear loader

            dailyData.forEach(day => {
                const date = new Date(day.dt * 1000);
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                const temp = Math.round(day.main.temp);
                const icon = day.weather[0].icon;

                const card = `
                    <div class="forecast-card">
                        <div class="forecast-day">${dayName}</div>
                        <div class="forecast-icon" style="color: ${getIconColor(icon)}">
                            ${getIconHTML(icon)}
                        </div>
                        <div>
                            <span class="forecast-temp">${temp}°</span>
                        </div>
                        <div class="forecast-low">${capitalize(day.weather[0].main)}</div>
                    </div>
                `;
                forecastContainer.innerHTML += card;
            });
        }

        // --- 3. Chart.js Logic ---
        function renderChart(labels, data) {
            const ctx = document.getElementById('hourlyChart').getContext('2d');
            
            if (weatherChart) weatherChart.destroy();

            const gradient = ctx.createLinearGradient(0, 0, 0, 200);
            gradient.addColorStop(0, 'rgba(56, 189, 248, 0.4)'); 
            gradient.addColorStop(1, 'rgba(56, 189, 248, 0.05)');

            // Chart.js default font color update for dark theme
            Chart.defaults.color = '#94a3b8';
            Chart.defaults.font.family = "'Segoe UI', system-ui, sans-serif";

            weatherChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Temperature',
                        data: data,
                        borderColor: '#38bdf8',
                        backgroundColor: gradient,
                        borderWidth: 3,
                        pointBackgroundColor: '#0f172a',
                        pointBorderColor: '#38bdf8',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        fill: true,
                        tension: 0.4 
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleFont: { size: 13 },
                            bodyFont: { size: 14, weight: 'bold' },
                            padding: 10,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y + '°C';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            display: false, 
                            beginAtZero: false
                        },
                        x: {
                            grid: { display: false, drawBorder: false },
                            ticks: { font: { size: 12 } }
                        }
                    }
                }
            });
        }

        // --- Helpers ---
        function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }
        
        function formatTime(timestamp) {
            return new Date(timestamp * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        function getCardinalDirection(deg) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return directions[Math.round(deg / 45) % 8];
        }

        function getIconHTML(code) {
            if(code.includes("n")) return '<i class="fas fa-moon"></i>';
            if(code.includes("01") || code.includes("02")) return '<i class="fas fa-sun"></i>';
            if(code.includes("03") || code.includes("04")) return '<i class="fas fa-cloud"></i>';
            if(code.includes("09") || code.includes("10")) return '<i class="fas fa-cloud-rain"></i>';
            if(code.includes("11")) return '<i class="fas fa-bolt"></i>';
            if(code.includes("13")) return '<i class="fas fa-snowflake"></i>';
            return '<i class="fas fa-smog"></i>';
        }

        function getIconColor(code) {
            if(code.includes("n")) return "#cbd5e1"; 
            if(code.includes("01") || code.includes("02")) return "#fbbf24"; 
            if(code.includes("09") || code.includes("10")) return "#38bdf8"; 
            if(code.includes("11")) return "#818cf8";
            return "#94a3b8"; 
        }

        // --- Event Listeners ---
        const input = document.getElementById("cityInput");
        const searchBtn = document.getElementById("searchBtn");

        // 1. Listen for Enter key
        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                getWeatherData(input.value);
            }
        });

        // 2. Listen for Button Click
        searchBtn.addEventListener("click", function() {
            getWeatherData(input.value);
        });

        // --- Init ---
        getWeatherData("Sandton");

    </script>
